<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas de matemáticas a la medida — SABI · Colegio CENTEC</title>
<meta name="description" content="Generador infinito de fichas de matemáticas imprimibles, de Transición a grado 11, con historias de Cali y clave de respuestas calculada paso a paso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,680&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#0B1F3F; --papel:#FBF8F1; --tinta:#1F1D1A; --oro:#B8862B; --oro-osc:#8A6418;
    --linea:#D9D2C3; --suave:#5B574F; --blanco:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--papel); color:var(--tinta); font-family:'Public Sans', system-ui, sans-serif; line-height:1.45; overflow-x:hidden;}
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; font-weight:560;}
  button, select, input{font:inherit;}
  :focus-visible{outline:3px solid var(--oro); outline-offset:2px;}

  header.barra{display:flex; align-items:center; gap:12px; padding:14px clamp(16px,4vw,32px); background:var(--noche); color:#F7F3E9;}
  header.barra .titulos{display:flex; flex-direction:column; min-width:0;}
  header.barra h1{font-size:clamp(1.02rem, .9rem + .6vw, 1.3rem); line-height:1.2;}
  header.barra .sub{font-size:.82rem; color:#E9D9B4;}
  header.barra a{margin-left:auto; color:rgba(247,243,233,.75); font-size:.85rem; text-decoration:none; white-space:nowrap;}
  header.barra a:hover{color:#fff; text-decoration:underline;}

  .app{max-width:1100px; margin:0 auto; padding:18px 16px 64px;}
  .controles{background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,150px), 1fr)); gap:12px 14px;}
  .controles .intro-ctl{grid-column:1/-1; font-family:'Literata', Georgia, serif; font-size:.98rem; color:#3D3A34;}
  .controles label{display:flex; flex-direction:column; gap:4px; font-size:.78rem; font-weight:600; color:var(--noche); min-width:0;}
  .controles select, .controles input[type=number]{width:100%; min-width:0; padding:8px 9px; border:1px solid var(--linea); border-radius:7px; background:var(--papel); color:var(--tinta); font-size:.95rem;}
  .controles .grupo-calc{grid-column:1/-1; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,130px), 1fr)); gap:12px 14px; padding-top:10px; border-top:1px dashed var(--linea);}
  .controles .grupo-calc[hidden]{display:none;}
  .acciones{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-top:4px;}
  .btn{background:var(--noche); color:#FBF8F1; border:1.5px solid var(--noche); border-radius:999px; padding:9px 16px; font-weight:600; font-size:.9rem; cursor:pointer;}
  .btn.sec{background:var(--blanco); color:var(--noche);}
  .btn:hover{filter:brightness(1.12);}
  .chk{display:inline-flex !important; flex-direction:row !important; align-items:center; gap:6px; font-size:.85rem !important; font-weight:500 !important; color:var(--tinta) !important;}
  .semilla-info{font-size:.78rem; color:var(--suave); margin-left:auto;}
  .aviso{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--noche); color:#fff; padding:10px 18px; border-radius:999px; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; max-width:90vw;}
  .aviso.ver{opacity:1;}

  /* ---------- Hoja ---------- */
  .hoja{background:var(--blanco); border:1px solid var(--linea); border-radius:4px; margin-top:18px; padding:clamp(16px, 4vw, 44px); box-shadow:0 2px 0 rgba(31,29,26,.04);}
  .ficha-cab .marca{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; font-size:.78rem; letter-spacing:.03em; text-transform:uppercase; color:var(--noche); font-weight:700; border-bottom:2px solid var(--noche); padding-bottom:6px;}
  .ficha-cab .marca span{font-weight:500; color:var(--suave); text-transform:none; letter-spacing:0;}
  .datos-est{display:grid; grid-template-columns:2.2fr 1fr 1.2fr; gap:10px 16px; margin:14px 0 6px; font-size:.92rem;}
  .datos-est div{display:flex; align-items:flex-end; gap:6px; min-width:0;}
  .datos-est .campo{flex:1; border-bottom:1.5px solid var(--tinta); min-height:1.3em; min-width:2em;}
  .ficha-titulo{font-size:clamp(1.45rem, 1.1rem + 1.4vw, 2.1rem); color:var(--noche); margin:16px 0 6px; line-height:1.15;}
  .gancho{font-family:'Literata', Georgia, serif; font-size:clamp(1rem, .95rem + .25vw, 1.12rem); color:#3D3A34; border-left:3px solid var(--oro); padding:2px 0 2px 12px; margin-bottom:12px;}
  .consigna{font-size:.95rem; margin:10px 0 14px;}
  .lista-precios{border:1.5px solid var(--tinta); border-radius:6px; padding:10px 12px; margin:6px 0 14px; max-width:460px;}
  .lista-precios h3{font-size:1rem; margin-bottom:4px; color:var(--noche);}
  .lista-precios table{width:100%; border-collapse:collapse; font-size:.92rem;}
  .lista-precios td{padding:3px 4px; border-bottom:1px dotted #9C968A;}
  .lista-precios td:last-child{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:600;}

  ol.items{list-style:none; counter-reset:it; display:grid; gap:18px 22px; padding:0;}
  ol.items.cols{grid-template-columns:repeat(auto-fill, minmax(min(100%, 210px), 1fr));}
  ol.items > li.item{counter-increment:it; position:relative; padding-left:2.3em; min-width:0; break-inside:avoid; page-break-inside:avoid;}
  ol.items > li.item::before{content:counter(it); position:absolute; left:0; top:.05em; width:1.65em; height:1.65em; border-radius:50%; border:1.5px solid var(--noche); color:var(--noche); font-weight:700; font-size:.88rem; display:flex; align-items:center; justify-content:center;}
  .item p{margin-bottom:6px; overflow-wrap:anywhere;}
  .enun{font-size:1rem;}
  .eq{font-size:1.12rem; font-variant-numeric:tabular-nums; line-height:2; overflow-wrap:anywhere;}
  .rl{display:inline-block; min-width:var(--w,4em); border-bottom:1.5px solid var(--tinta); height:1.1em; vertical-align:-0.2em; margin:0 .15em;}
  .nota{font-size:.86em; color:var(--suave);}
  .fila-dib{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:4px 0 6px;}
  .signo{font-size:1.6rem; font-weight:700; color:var(--noche);}
  svg.fig{display:block; max-width:100%; height:auto; overflow:visible;}
  .fila-dib svg.fig{display:inline-block;}
  .fig text{font-family:'Public Sans', sans-serif; fill:var(--tinta);}
  .fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15; font-size:.92em; margin:0 .12em;}
  .fr > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .2em;}
  .fr > span{padding:0 .2em;}
  sup{font-size:.7em; line-height:0;}
  table.vert{border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:1.25rem; margin:2px 0;}
  table.vert td{width:1.25em; height:1.45em; text-align:center; padding:0;}
  table.vert tr.lleva td{height:1em; font-size:.7em;}
  table.vert tr.lleva td::after{content:''; display:inline-block; width:.7em; height:.7em; border:1px dashed #9C968A; border-radius:2px;}
  table.vert tr.lleva td.sin::after{display:none;}
  table.vert tr.raya td{border-top:2px solid var(--tinta);}
  table.vert td.sg{font-weight:700;}
  .sistema{display:inline-flex; flex-direction:column; border-left:2px solid var(--tinta); padding:2px 0 2px 10px; font-size:1.1rem; line-height:1.8; margin:4px 0;}
  .serie{display:flex; flex-wrap:wrap; gap:6px 4px; align-items:center; font-size:1.15rem; font-variant-numeric:tabular-nums; margin:6px 0;}
  .serie .t{padding:2px 4px;}
  .serie .hueco{display:inline-block; width:3.2em; height:1.7em; border:1.5px solid var(--tinta); border-radius:4px; background:#fff;}
  .serie .sep{color:var(--suave);}
  .serie .par{display:inline-flex; align-items:center; gap:3px; white-space:nowrap;}
  table.tabla{border-collapse:collapse; font-size:.95rem; margin:6px 0; max-width:100%;}
  table.tabla th, table.tabla td{border:1.2px solid var(--tinta); padding:4px 8px; text-align:center; min-width:2.4em; height:1.9em;}
  table.tabla th{background:#F3EEE3; font-weight:600;}
  .tabla-marco{max-width:100%; overflow-x:auto;}
  .andamio{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .andamio.uno{grid-template-columns:1fr;}
  .caja{border:1.2px solid var(--tinta); border-radius:5px; min-height:3.6em; padding:3px 7px; font-size:.75rem; color:var(--suave); font-weight:600;}
  .caja.alta{min-height:7em;}
  .caja.ancha{grid-column:1/-1;}
  ol.pasos{margin:6px 0 8px; padding-left:0; list-style:none; counter-reset:pa;}
  ol.pasos li{counter-increment:pa; position:relative; padding:4px 6px 4px 3.9em; border:1px solid var(--linea); border-radius:5px; margin-bottom:5px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere;}
  ol.pasos li::before{content:'Paso ' counter(pa); position:absolute; left:6px; top:6px; font-size:.72rem; font-weight:700; color:var(--noche); white-space:nowrap;}
  .respuestas-error{display:grid; grid-template-columns:1fr; gap:6px; font-size:.9rem;}
  .respuestas-error div{display:flex; gap:6px; align-items:flex-end;}
  .respuestas-error .campo{flex:1; border-bottom:1.2px solid var(--tinta); min-height:1.4em;}

  .autoeval{margin-top:26px; border:1.5px solid var(--tinta); border-radius:8px; padding:12px 14px; break-inside:avoid; page-break-inside:avoid;}
  .autoeval h3{font-size:1.05rem; margin-bottom:8px; color:var(--noche);}
  .autoeval .ops{display:flex; flex-wrap:wrap; gap:10px 22px; font-size:.95rem;}
  .autoeval .ops span{display:inline-flex; align-items:center; gap:7px;}
  .autoeval .ops span::before{content:''; width:1.05em; height:1.05em; border:1.5px solid var(--tinta); border-radius:3px; display:inline-block;}
  .autoeval .costo{display:flex; gap:6px; align-items:flex-end; margin-top:10px; font-size:.92rem;}
  .autoeval .costo span.campo{flex:1; border-bottom:1.2px solid var(--tinta); min-height:1.3em;}
  .pie{margin-top:16px; padding-top:8px; border-top:1px solid var(--linea); display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; font-size:.75rem; color:var(--suave);}

  /* ---------- Clave ---------- */
  #clave[hidden]{display:none;}
  #clave h2{font-size:1.4rem; color:var(--noche);}
  #clave .sub{font-size:.85rem; color:var(--suave); margin-bottom:12px;}
  ol.clave-lista{padding-left:1.6em; display:grid; gap:10px;}
  ol.clave-lista > li{padding-left:.3em; break-inside:avoid; page-break-inside:avoid; overflow-wrap:anywhere;}
  ol.clave-lista > li::marker{font-weight:700; color:var(--noche);}
  .clave-item ol.pasos-clave{padding-left:1.3em; margin:3px 0;}
  .clave-item .etq{font-weight:700; color:var(--noche);}
  .clave-item b{font-weight:700;}
  .clave-item svg.fig{margin:4px 0;}

  /* ---------- Figuras SVG ---------- */
  .f-lleno{fill:var(--noche); stroke:var(--tinta); stroke-width:1.5;}
  .f-vacio{fill:#fff; stroke:var(--tinta); stroke-width:2;}
  .f-raya{fill:url(#pat-raya); stroke:var(--tinta); stroke-width:1.5;}
  .f-punto{fill:url(#pat-punto); stroke:var(--tinta); stroke-width:1.5;}
  .f-hueco{fill:#fff; stroke:var(--tinta); stroke-width:1.5; stroke-dasharray:4 3;}
  .tacha{stroke:var(--tinta); stroke-width:3; stroke-linecap:round;}
  .g-fig{fill:#F3EEE3; stroke:var(--tinta); stroke-width:2; stroke-linejoin:round;}
  .g-fig2{fill:#E4D9BF; stroke:var(--tinta); stroke-width:2;}
  .g-linea{stroke:var(--tinta); stroke-width:2; fill:none;}
  .g-fina{stroke:var(--tinta); stroke-width:1; fill:none;}
  .g-guia{stroke:var(--tinta); stroke-width:1.3; stroke-dasharray:5 4; fill:none;}
  .g-cuad{stroke:#B9B09C; stroke-width:.8; fill:none;}
  .g-eje{stroke:var(--tinta); stroke-width:1.6;}
  .g-borde{stroke:var(--tinta); stroke-width:3; stroke-linecap:square;}
  .g-celda{fill:#D9CDB0;}
  .g-celda2{fill:url(#pat-raya);}
  .g-punto{fill:var(--tinta);}
  .t-et{font-size:13px; font-weight:600;}
  .t-chico{font-size:10px;}
  .moneda{fill:#F1E7CF; stroke:var(--tinta); stroke-width:1.6;}
  .moneda-in{fill:none; stroke:var(--tinta); stroke-width:.8;}
  .moneda-bi{fill:#DCCBA2; stroke:var(--tinta); stroke-width:.8;}
  .billete{fill:#FFFFFF; stroke:var(--tinta); stroke-width:1.6;}
  .billete-in{fill:none; stroke:var(--tinta); stroke-width:.7; stroke-dasharray:3 2;}
  .etiqueta-precio{fill:#fff; stroke:var(--tinta); stroke-width:1.4;}

  @media (max-width:560px){
    .datos-est{grid-template-columns:1fr 1fr;}
    .datos-est div:first-child{grid-column:1/-1;}
    .andamio{grid-template-columns:1fr;}
    .semilla-info{margin-left:0; width:100%;}
    header.barra a{font-size:.78rem;}
  }

  .practica{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:.45em 0 .2em;}
  .practica input{font:inherit; padding:6px 10px; border:1.5px solid #C9C3B5; border-radius:8px; min-width:9em; max-width:100%;}
  .practica .fb{font-size:.92rem;}
  .practica .fb.bien{color:#1B6B3A;} .practica .fb.mal{color:#8A3B12;}
  .practica button{font:inherit; font-size:.88rem; background:none; border:none; color:#1A2D7A; text-decoration:underline; cursor:pointer; padding:4px;}
  .revisar-todo{margin:1em 0 .2em; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .revisar-todo button{font:inherit; font-weight:600; background:#1A2D7A; color:#fff; border:none; border-radius:10px; padding:10px 18px; cursor:pointer; min-height:44px;}
  @media print{
    @page{margin:13mm 12mm;}
    html, body{background:#fff !important;}
    body{font-size:11pt;}
    header.barra, .controles, .aviso, .no-print{display:none !important;}
    .app{max-width:none; padding:0; margin:0;}
    .hoja{border:none; box-shadow:none; margin:0; padding:0; border-radius:0;}
    #clave, #clave[hidden]{display:none !important;}
    body.imprimir-clave #clave{display:block !important; break-before:page; page-break-before:always;}
    ol.items{gap:12px 18px;}
    ol.items.cols{grid-template-columns:repeat(3, minmax(0,1fr));}
    .item, .autoeval, ol.clave-lista > li{break-inside:avoid; page-break-inside:avoid;}
    .gancho{border-left-color:#000;}
    * {-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>
<!-- Patrones compartidos por todas las figuras (no se ocultan con display:none para que funcionen al imprimir) -->
<svg width="0" height="0" style="position:absolute; width:0; height:0;" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="pat-raya" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FFFFFF"/><rect width="2.6" height="6" fill="#6E5214"/>
    </pattern>
    <pattern id="pat-punto" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF"/><circle cx="3" cy="3" r="1.4" fill="#1F1D1A"/>
    </pattern>
  </defs>
</svg>

<header class="barra">
  <div class="titulos">
    <h1>Fichas de matemáticas a la medida</h1>
    <span class="sub">SABI · Colegio CENTEC · de Transición a 11°</span>
  </div>
  <a href="index.html">Volver al sitio</a>
</header>

<main class="app">
  <form class="controles no-print" id="controles" aria-label="Configura tu ficha" onsubmit="return false;">
    <p class="intro-ctl">Una buena ficha empieza con una buena idea. Elige el tipo, el grado y la dificultad: cada ficha trae una historia de Cali y su clave de respuestas calculada paso a paso.</p>
    <label>Tipo de ficha
      <select id="c-tipo"></select>
    </label>
    <label>Grado
      <select id="c-grado"></select>
    </label>
    <label>Dificultad
      <select id="c-dif">
        <option value="facil">Fácil</option>
        <option value="media">Media</option>
        <option value="reto">Reto</option>
      </select>
    </label>
    <label>Cantidad de ejercicios
      <input type="number" id="c-n" min="4" max="20" step="1" inputmode="numeric">
    </label>
    <label>Historia (tema)
      <select id="c-tema"></select>
    </label>
    <label id="l-sub">Enfoque
      <select id="c-sub"></select>
    </label>
    <div class="grupo-calc" id="g-calc" hidden>
      <label>Desde (mínimo)
        <input type="number" id="c-rmin" min="0" max="9999999" step="1" inputmode="numeric" placeholder="automático">
      </label>
      <label>Hasta (máximo)
        <input type="number" id="c-rmax" min="1" max="9999999" step="1" inputmode="numeric" placeholder="automático">
      </label>
      <label>Con llevada / préstamo
        <select id="c-llevada">
          <option value="auto">Automático</option>
          <option value="si">Sí, siempre</option>
          <option value="no">No, nunca</option>
        </select>
      </label>
    </div>
    <div class="acciones">
      <button type="button" class="btn" id="b-nueva">Nueva ficha</button>
      <button type="button" class="btn sec" id="b-clave" aria-pressed="false">Mostrar clave</button>
      <button type="button" class="btn sec" id="b-copiar">Copiar enlace</button>
      <button type="button" class="btn sec" id="b-imprimir">Imprimir</button>
      <label class="chk"><input type="checkbox" id="c-imp-clave"> Incluir la clave al imprimir (en hoja aparte)</label>
      <span class="semilla-info" id="semilla-info"></span>
    </div>
  </form>

  <article class="hoja" id="ficha" aria-live="polite"></article>
  <section class="hoja" id="clave" hidden aria-label="Clave de respuestas"></section>
</main>
<div class="aviso" id="aviso" role="status"></div>
<script>
(function(){
'use strict';
/* =====================================================================
   SABI · Fichas de matemáticas a la medida — Colegio CENTEC (Cali)
   Motor determinista: la misma URL produce siempre la misma ficha.
   Todas las respuestas se CALCULAN por código (nunca se escriben a mano).
   ===================================================================== */

// ---------- Azar con semilla ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function Rng(seed){
  const f=mulberry32(seed>>>0);
  const R={
    r:f,
    int(a,b){a=Math.ceil(a);b=Math.floor(b);if(b<a)b=a;return a+Math.floor(f()*(b-a+1));},
    pick(a){return a[Math.floor(f()*a.length)];},
    shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;},
    sample(a,k){return R.shuffle(a).slice(0,k);},
    bool(p){return f()<(p==null?0.5:p);},
    nz(a,b){let x,t=0;do{x=R.int(a,b);t++;}while(x===0&&t<100);return x===0?1:x;}
  };
  return R;
}

// ---------- Formato numérico es-CO ----------
function fmt(n,dec){
  if(typeof n!=='number'||!isFinite(n)) throw new Error('Número inválido en la ficha: '+n);
  const x=Math.abs(n);
  let s=dec==null?String(Math.round(x*1e6)/1e6):x.toFixed(dec);
  if(s.indexOf('e')>=0) s=x.toFixed(dec==null?0:dec);
  let parts=s.split('.'); let i=parts[0], fr=parts[1];
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const out=i+(fr?','+fr:'');
  const esCero=out.replace(/[0.,]/g,'')==='';
  return (n<0&&!esCero?'−':'')+out;
}
const money=n=>'$ '+fmt(n);
const par=n=>n<0?'('+fmt(n)+')':fmt(n);
const dec2=x=>fmt(Math.round(x*100)/100);
function decS(v,e){ // entero v con e decimales -> texto es-CO sin ceros sobrantes
  const neg=v<0; let s=String(Math.abs(v)); while(s.length<e+1) s='0'+s;
  let i=s.slice(0,s.length-e), f=e?s.slice(s.length-e):''; f=f.replace(/0+$/,'');

const RELLENOS={lleno:['f-lleno','oscuro'],raya:['f-raya','rayado'],vacio:['f-vacio','blanco'],punto:['f-punto','punteado']};
const FORMAS={circulo:'círculo',triangulo:'triángulo',cuadrado:'cuadrado',estrella:'estrella',rombo:'rombo'};
function formaSVG(tipo,cx,cy,r,cls,extra){
  extra=extra||'';
  if(tipo==='circulo') return '<circle cx="'+r1(cx)+'" cy="'+r1(cy)+'" r="'+r1(r*0.9)+'" class="'+cls+'"'+extra+'/>';
  if(tipo==='cuadrado') return '<rect x="'+r1(cx-r*0.82)+'" y="'+r1(cy-r*0.82)+'" width="'+r1(r*1.64)+'" height="'+r1(r*1.64)+'" class="'+cls+'"'+extra+'/>';
  let pts=[];
  if(tipo==='triangulo') pts=[[cx,cy-r],[cx+r*0.95,cy+r*0.8],[cx-r*0.95,cy+r*0.8]];
  else if(tipo==='rombo') pts=[[cx,cy-r],[cx+r*0.8,cy],[cx,cy+r],[cx-r*0.8,cy]];
  else { for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.45:r; pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);} }
  return '<polygon points="'+pts.map(p=>r1(p[0])+','+r1(p[1])).join(' ')+'" class="'+cls+'"'+extra+'/>';
}
// k objetos en filas de 5 (marco de diez); los últimos "tach" aparecen tachados; "vacios" se dibujan punteados
function grupoFiguras(k,forma,tach,vacios){
  tach=tach||0; vacios=vacios||0; const tot=k+vacios, s=28;
  const cols=Math.min(Math.max(tot,1),5), rows=Math.max(1,Math.ceil(tot/5));
  let g='';
  for(let i=0;i<tot;i++){
    const x=4+(i%5)*s+s/2, y=4+Math.floor(i/5)*s+s/2;
    g+=formaSVG(forma,x,y,11,i<k?'f-lleno obj':'f-hueco');
    if(i<k&&i>=k-tach) g+='<path d="M'+(x-11)+' '+(y-11)+'L'+(x+11)+' '+(y+11)+'M'+(x+11)+' '+(y-11)+'L'+(x-11)+' '+(y+11)+'" class="tacha"/>';
  }
  return svgW(cols*s+8,rows*s+8,g,'grupo de figuras para contar');
}
// Operación en columna (suma, resta, multiplicación)
function vertical(a,b,signo){
  const A=String(a),B=String(b);
  const w=signo==='×'?A.length+B.length+1:Math.max(A.length,B.length)+1;
  const fila=(s,sg)=>{let c='';const pad=w-s.length-(sg?1:0); if(sg) c+='<td class="sg">'+sg+'</td>'; for(let i=0;i<pad;i++) c+='<td></td>'; for(const ch of s) c+='<td>'+ch+'</td>'; return c;};
  let h='<table class="vert" aria-label="'+a+' '+signo+' '+b+' en columna"><tr class="lleva">'+'<td class="sin"></td>'+'<td></td>'.repeat(w-1)+'</tr>';
  h+='<tr>'+fila(A,'')+'</tr><tr>'+fila(B,signo)+'</tr>';
  const extra=(signo==='×'&&B.length>1)?B.length+1:1;
  for(let i=0;i<extra;i++) h+='<tr class="'+(i===0||i===extra-1&&extra>1?'raya':'')+'">'+'<td></td>'.repeat(w)+'</tr>';
  return h+'</table>';
}

function poligono(P,cls){return '<polygon points="'+P.map(p=>r1(p[0])+','+r1(p[1])).join(' ')+'" class="'+(cls||'g-fig')+'"/>';}

function triRect(a,b,et,theta){

CALC.suma=c=>{const {R,g,d,p}=c; const rg=rango(c,RSUMA[Math.min(g,5)][d]);

    return {html:'<div class="fila-dib">'+grupoFiguras(a,'circulo')+'<span class="signo">+</span>'+grupoFiguras(b,'circulo')+'</div><p class="eq">'+a+' + '+b+' = '+rl(2)+'</p>',clave:a+' + '+b+' = <b>'+tot+'</b>',chk:ex('a+b',{a,b},tot,fmt(tot)),uid:'s'+a+'+'+b};}

CALC.resta=c=>{const {R,g,d,p}=c; const rg=rango(c,RSUMA[Math.min(g,5)][d]);

CALC.mixtas=c=>{const {R,g,d}=c;

  const f=R.pick(forms); let v, pasos, r;
  if(f==='a+b*c'){v={a:R.int(2,big*3),b:R.int(2,big),c:R.int(2,9)}; const p=v.b*v.c; r=v.a+p; pasos=[fmt(v.b)+' × '+fmt(v.c)+' = '+fmt(p),fmt(v.a)+' + '+fmt(p)+' = '+fmt(r)];}

  else if(f==='a*(b-c)+d'){const b=R.int(5,big+10),cc=R.int(1,b-1); v={a:R.int(2,9),b,c:cc,d:R.int(1,big*3)}; const s=b-cc,p=v.a*s; r=p+v.d; pasos=['Primero el paréntesis: '+fmt(b)+' − '+fmt(cc)+' = '+fmt(s),fmt(v.a)+' × '+fmt(s)+' = '+fmt(p),fmt(p)+' + '+fmt(v.d)+' = '+fmt(r)];}

CALC.fracciones=c=>{const {R,g,d}=c; const kinds=g<=4?['misma','de','simplificar']:g===5?['misma','distinta','de','simplificar']:['distinta','mult','div','de','distinta'];

  if(k==='misma'){const den=R.int(3,maxD); let a=R.int(1,den-1),b=R.int(1,den-1); let op=(g>=5&&R.bool())?'−':'+'; if(op==='−'&&a<b){const x=a;a=b;b=x;} if(a===b) op='+';

  if(k==='distinta'||k==='mult'||k==='div'){let b1,b2,a1,a2; do{b1=R.int(2,maxD);b2=R.int(2,maxD);}while(b1===b2); a1=R.int(1,b1-1); a2=R.int(1,b2-1);

      clave='m.c.m.('+b1+', '+b2+') = '+L+' → '+frT(a1,b1)+' = '+frT(x1,L)+' y '+frT(a2,b2)+' = '+frT(x2,L)+' → '+frT(x1,L)+' '+op+' '+frT(x2,L)+' = '+frT(n,L)+' → '+frClave(n,L);}

    return {html:'<p class="eq">'+frH(a,b)+' de '+fmt(N)+' = '+rl(3)+'</p>',clave:fmt(N)+' ÷ '+b+' = '+kk+'; '+kk+' × '+a+' = <b>'+fmt(r)+'</b>',chk:{f:'frac',op:'de',a:[a,b],N,r:[r,1],mostrar:fmt(r)},uid:'fo'+a+'/'+b+'de'+N};}
  let a,b; do{b=R.int(2,maxD);a=R.int(1,b-1);}while(gcd(a,b)!==1); const m=R.int(2,d===2?9:5);

function decAleat(R,maxInt,e){let v=R.int(Math.pow(10,e),maxInt*Math.pow(10,e)); if(v%10===0) v+=R.int(1,9); return v;}
CALC.decimales=c=>{const {R,g,d}=c; const kinds=g<=5?['suma','resta','multEnt','pot10']:['suma','resta','multEnt','multDec','divEnt','pot10'];
  const k=R.pick(kinds), maxI=d===0?20:d===1?100:1000; const P=Math.pow;

    return {html:'<p class="eq">'+decS(v1,1)+' × '+decS(v2,1)+' = '+rl(4)+'</p>',clave:decS(v1,1)+' × '+decS(v2,1)+' = <b>'+decS(v1*v2,2)+'</b> <span class="nota">('+v1+' × '+v2+' = '+fmt(v1*v2)+', con 2 decimales)</span>',chk:ex('a*b',{a:v1/10,b:v2/10},v1*v2/100,decS(v1*v2,2),{tol:1e-9}),uid:'dd'+v1+'x'+v2};}
  if(k==='divEnt'){const e=R.int(1,2), q=decAleat(R,d===2?60:15,e), m=R.int(2,9), D=q*m;
    return {html:'<p class="eq">'+decS(D,e)+' ÷ '+m+' = '+rl(4)+'</p>',clave:decS(D,e)+' ÷ '+m+' = <b>'+decS(q,e)+'</b> <span class="nota">(comprobación: '+decS(q,e)+' × '+m+' = '+decS(D,e)+')</span>',chk:ex('a/b',{a:D/P(10,e),b:m},q/P(10,e),decS(q,e),{tol:1e-9}),uid:'dv'+D+'/'+m};}
  const e=R.int(1,3), v=decAleat(R,d===2?999:99,e), kk=R.int(1,3), por=R.bool(), f=P(10,kk);
  const res=por?(e>=kk?decS(v,e-kk):decS(v*P(10,kk-e),0)):decS(v,e+kk); const val=por?v/P(10,e)*f:v/P(10,e)/f;
  return {html:'<p class="eq">'+decS(v,e)+' '+(por?'×':'÷')+' '+fmt(f)+' = '+rl(4)+'</p>',clave:decS(v,e)+' '+(por?'×':'÷')+' '+fmt(f)+' = <b>'+res+'</b> <span class="nota">(la coma se corre '+kk+' lugar'+(kk>1?'es':'')+' a la '+(por?'derecha':'izquierda')+')</span>',chk:ex(por?'a*b':'a/b',{a:v/P(10,e),b:f},val,res,{tol:1e-9}),uid:'dp'+v+por+kk};};

CALC.enteros=c=>{const {R,d}=c; const M=d===0?10:d===1?20:50;
  if(d===2&&R.bool(0.4)){const a=R.nz(-12,12),b=R.nz(-12,12),cc=R.nz(-30,30); const f=R.pick(['a*b+c','a-b*c']); let r,pasos;
    if(f==='a*b+c'){const p=a*b; r=p+cc; pasos=[par(a)+' × '+par(b)+' = '+fmt(p),fmt(p)+' + '+par(cc)+' = '+fmt(r)];}
    else {const p=b*cc; r=a-p; pasos=[par(b)+' × '+par(cc)+' = '+fmt(p),fmt(a)+' − '+par(p)+' = '+fmt(r)];}
    const disp=f==='a*b+c'?fmt(a)+' × '+par(b)+' + '+par(cc):fmt(a)+' − '+par(b)+' × '+par(cc);
    return {html:'<p class="eq">'+disp+' = '+rl(3)+'</p>',clave:pasos.join(' → ')+' · <b>'+fmt(r)+'</b>',chk:ex(f,{a,b,c:cc},r,fmt(r)),uid:'e'+f+a+b+cc};}
  const op=R.pick(['+','−','×','÷']); let a,b,r,regla;
  if(op==='÷'){b=R.nz(-12,12); if(Math.abs(b)===1) b=b*R.int(2,9); const q=R.nz(-Math.min(M,15),Math.min(M,15)); a=b*q; r=q; regla='signos iguales dan +, diferentes dan −';}
  else if(op==='×'){const L=d===2?20:12; a=R.nz(-L,L); b=R.nz(-L,L); r=a*b; regla='signos iguales dan +, diferentes dan −';}
  else {a=R.nz(-M,M); b=R.nz(-M,M); r=op==='+'?a+b:a-b; regla=op==='−'?'restar es sumar el opuesto: '+fmt(a)+' + '+par(-b):(Math.sign(a)===Math.sign(b)?'signos iguales: se suman y se deja el signo':'signos diferentes: se restan y se deja el signo del mayor');}
  if(a>0&&b>0){a=-a; r=op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:a/b;}
  if(op==='+') regla=Math.sign(a)===Math.sign(b)?'signos iguales: se suman y se deja el signo':'signos diferentes: se restan y se deja el signo del mayor';
  if(op==='−') regla='restar es sumar el opuesto: '+fmt(a)+' + '+par(-b);
  return {html:'<p class="eq">'+fmt(a)+' '+op+' '+par(b)+' = '+rl(3)+'</p>',clave:fmt(a)+' '+op+' '+par(b)+' = <b>'+fmt(r)+'</b> <span class="nota">('+regla+')</span>',chk:ex({'+':'a+b','−':'a-b','×':'a*b','÷':'a/b'}[op],{a,b},r,fmt(r)),uid:'e'+a+op+b};};

CALC.potencias=c=>{const {R,g,d}=c; const kinds=['valor','producto','cociente','potpot','raiz'].concat(g>=7?['cero','negativa']:[]); const k=R.pick(kinds); const P=Math.pow; const lim=d===0?1000:d===1?10000:1e6;
  if(k==='valor'){let a,n; do{a=R.int(2,d===2?12:9); n=R.int(2,d===0?3:5);}while(P(a,n)>lim); const r=P(a,n);
    return {html:'<p class="eq">'+a+'<sup>'+n+'</sup> = '+rl(4)+'</p>',clave:a+'<sup>'+n+'</sup> = '+Array(n).fill(a).join(' × ')+' = <b>'+fmt(r)+'</b>',chk:ex('Math.pow(a,n)',{a,n},r,fmt(r)),uid:'pv'+a+'^'+n};}
  if(k==='producto'||k==='cociente'){let a,m,n; do{a=R.int(2,d===0?3:6); m=R.int(2,6); n=R.int(1,5);}while((k==='producto'?P(a,m+n):P(a,m))>Math.max(lim,4096)||(k==='cociente'&&m<=n));
    const e=k==='producto'?m+n:m-n, r=P(a,e), op=k==='producto'?'×':'÷';
    return {html:'<p class="enun">Escribe como una sola potencia y calcula su valor:</p><p class="eq">'+a+'<sup>'+m+'</sup> '+op+' '+a+'<sup>'+n+'</sup> = '+rl(3)+' = '+rl(3)+'</p>',clave:a+'<sup>'+m+'</sup> '+op+' '+a+'<sup>'+n+'</sup> = '+a+'<sup>'+m+' '+(k==='producto'?'+':'−')+' '+n+'</sup> = '+a+'<sup>'+e+'</sup> = <b>'+fmt(r)+'</b>',chk:ex(k==='producto'?'Math.pow(a,m)*Math.pow(a,n)':'Math.pow(a,m)/Math.pow(a,n)',{a,m,n},r,fmt(r)),uid:'pp'+k+a+m+n};}
  if(k==='potpot'){const a=R.int(2,3); let m,n; do{m=R.int(2,4);n=R.int(2,3);}while(m*n>(a===2?12:8)); const r=P(a,m*n);
    return {html:'<p class="eq">('+a+'<sup>'+m+'</sup>)<sup>'+n+'</sup> = '+rl(3)+' = '+rl(3)+'</p>',clave:'('+a+'<sup>'+m+'</sup>)<sup>'+n+'</sup> = '+a+'<sup>'+m+' × '+n+'</sup> = '+a+'<sup>'+(m*n)+'</sup> = <b>'+fmt(r)+'</b>',chk:ex('Math.pow(Math.pow(a,m),n)',{a,m,n},r,fmt(r)),uid:'pq'+a+m+n};}
  if(k==='cero'){const a=R.int(2,99), b=R.int(2,12), r=1+b*b;
    return {html:'<p class="eq">'+a+'<sup>0</sup> + '+b+'<sup>2</sup> = '+rl(3)+'</p>',clave:a+'<sup>0</sup> = 1 (todo número distinto de 0 elevado a 0 da 1); '+b+'<sup>2</sup> = '+(b*b)+'; 1 + '+(b*b)+' = <b>'+fmt(r)+'</b>',chk:ex('Math.pow(a,0)+b*b',{a,b},r,fmt(r)),uid:'pc'+a+b};}
  if(k==='negativa'){let a,n; do{a=R.int(2,d===2?6:4); n=R.int(2,5);}while(P(a,n)>lim); const r=P(-a,n);
    return {html:'<p class="eq">(−'+a+')<sup>'+n+'</sup> = '+rl(3)+'</p>',clave:'(−'+a+')<sup>'+n+'</sup> = <b>'+fmt(r)+'</b> <span class="nota">(exponente '+(n%2?'impar: el resultado es negativo':'par: el resultado es positivo')+')</span>',chk:ex('Math.pow(-a,n)',{a,n},r,fmt(r)),uid:'pn'+a+n};}
  const cubo=d===2&&R.bool(0.4); const kk=cubo?R.int(2,10):R.int(2,d===0?10:d===1?15:25); const x=cubo?kk*kk*kk:kk*kk;
  return {html:'<p class="eq">'+(cubo?'∛':'√')+'<span style="text-decoration:overline">'+fmt(x)+'</span> = '+rl(3)+'</p>',clave:(cubo?'∛':'√')+fmt(x)+' = <b>'+kk+'</b> <span class="nota">(porque '+kk+(cubo?'³':'²')+' = '+fmt(x)+')</span>',chk:ex(cubo?'Math.cbrt(x)':'Math.sqrt(x)',{x},kk,fmt(kk),{tol:1e-9}),uid:'pr'+x+cubo};};

CALC.ecuaciones=c=>{const {R,d}=c;
  if(d===2&&R.bool(0.6)){let a,cc; do{a=R.nz(-9,9);cc=R.nz(-9,9);}while(a===cc||Math.abs(a)===1&&Math.abs(cc)===1);
    const x=R.nz(-10,10), b=R.int(-20,20), e=(a-cc)*x+b;
    const pasos=['Agrupo las x a la izquierda y los números a la derecha: '+fmt(a)+'x − '+par(cc)+'x = '+fmt(e)+' − '+par(b),fmt(a-cc)+'x = '+fmt(e-b),'x = '+fmt(e-b)+' ÷ '+par(a-cc)];
    return {html:'<p class="eq">'+poly([a,b])+' = '+poly([cc,e])+'</p><p class="eq">x = '+rl(3)+'</p>',clave:pasos.join(' → ')+' → <b>x = '+fmt(x)+'</b>',chk:{f:'ecu',a,b,c:cc,d:e,x,mostrar:'x = '+fmt(x)},uid:'q'+a+b+cc+e};}
  let a=d===0?R.int(2,6):R.int(2,9); if(d===2&&R.bool(0.3)) a=-a; const x=d===0?R.int(1,10):R.nz(-10,10), b=d===0?R.int(1,20):R.nz(-25,25), cc=a*x+b;
  const pasos=['Paso '+(b>0?'el +'+fmt(b)+' a restar':'el −'+fmt(-b)+' a sumar')+': '+fmt(a)+'x = '+fmt(cc)+(b>0?' − ':' + ')+fmt(Math.abs(b))+' = '+fmt(cc-b),'x = '+fmt(cc-b)+' ÷ '+par(a)];
  return {html:'<p class="eq">'+poly([a,b])+' = '+fmt(cc)+'</p><p class="eq">x = '+rl(3)+'</p>',clave:pasos.join(' → ')+' → <b>x = '+fmt(x)+'</b> <span class="nota">(comprobación: '+fmt(a)+' × '+par(x)+(b>0?' + ':' − ')+fmt(Math.abs(b))+' = '+fmt(cc)+')</span>',chk:{f:'ecu',a,b,c:0,d:cc,x,mostrar:'x = '+fmt(x)},uid:'q'+a+b+cc};};

CALC.sistemas=c=>{const {R,d}=c; let a1,b1,a2,b2,x,y;
  if(d===0){x=R.int(2,12); y=R.int(1,x-1); a1=1;b1=1;a2=1;b2=-1;}
  else { x=R.nz(-8,8); y=R.nz(-8,8); do{a1=R.nz(-5,5);b1=R.nz(-5,5);a2=R.nz(-5,5);b2=R.nz(-5,5);}while(a1*b2-a2*b1===0); }
  const c1=a1*x+b1*y, c2=a2*x+b2*y; const ky=b1*a2-b2*a1, rh=c1*a2-c2*a1;
  const clave='Multiplico la 1.ª ecuación por '+par(a2)+' y la 2.ª por '+par(a1)+' y las resto: '+fmt(ky)+'y = '+fmt(rh)+' → y = '+fmt(y)+'. Sustituyo en la 1.ª: '+fmt(a1)+'x = '+fmt(c1)+' − '+par(b1*y)+' → x = '+fmt(x)+'. <b>x = '+fmt(x)+', y = '+fmt(y)+'</b>';
  return {html:'<div class="sistema"><span>'+lin([[a1,'x'],[b1,'y']])+' = '+fmt(c1)+'</span><span>'+lin([[a2,'x'],[b2,'y']])+' = '+fmt(c2)+'</span></div><p class="eq">x = '+rl(2)+' y = '+rl(2)+'</p>',clave,chk:{f:'sis',eqs:[[a1,b1,c1],[a2,b2,c2]],x,y,mostrar:'x = '+fmt(x)+', y = '+fmt(y)},uid:'si'+[a1,b1,c1,a2,b2,c2].join(',')};};

CALC.cuadraticas=c=>{const {R,d}=c; let r1_,r2_; do{ if(d===0){r1_=R.int(1,6);r2_=R.int(1,7);} else {r1_=R.nz(-9,9);r2_=R.nz(-9,9);} }while(r1_===r2_&&R.bool(0.8));
  const A=d===2?R.pick([1,2,3,-1]):1, B=-A*(r1_+r2_), C=A*r1_*r2_; const lo=Math.min(r1_,r2_), hi=Math.max(r1_,r2_);
  let clave;
  if(A===1) clave='Busco dos números que multiplicados den '+fmt(C)+' y sumados den '+fmt(-B)+': '+fmt(r1_)+' y '+fmt(r2_)+'. Factorizo: '+factor(r1_)+factor(r2_)+' = 0';
  else {const D=B*B-4*A*C; clave='Δ = b² − 4ac = '+par(B)+'² − 4·'+par(A)+'·'+par(C)+' = '+fmt(D)+'; √Δ = '+fmt(Math.sqrt(D))+'; x = ('+fmt(-B)+' ± '+fmt(Math.sqrt(D))+') ÷ '+par(2*A);}
  clave+=' → '+(lo===hi?'<b>x = '+fmt(lo)+'</b> (raíz doble)':'<b>x = '+fmt(lo)+'</b> o <b>x = '+fmt(hi)+'</b>');
  return {html:'<p class="eq">'+poly([A,B,C])+' = 0</p><p class="eq">x = '+rl(2)+' o x = '+rl(2)+'</p>',clave,chk:{f:'cuad',a:A,b:B,c:C,raices:[lo,hi],mostrar:'x = '+fmt(lo)},uid:'cu'+A+B+C};};

CALC.porcentajes=c=>{const {R,g,d}=c; const kinds=['de','que','aumento','descuento'].concat(g>=10?['inverso']:[]); const k=R.pick(kinds);
  const ps=d===0?[10,20,25,50]:d===1?[5,10,15,20,25,30,40,75]:[6,8,12,15,35,45];
  const p=R.pick(ps), u=100/gcd(p,100);
  if(k==='de'){const N=u*R.int(1,d===0?20:200)*(R.bool()?10:1), r=N*p/100;
    return {html:'<p class="eq">'+p+' % de '+fmt(N)+' = '+rl(3)+'</p>',clave:fmt(N)+' × '+p+' ÷ 100 = <b>'+fmt(r)+'</b>',chk:ex('N*p/100',{N,p},r,fmt(r)),uid:'%d'+p+N};}
  if(k==='que'){const b=u*R.int(1,d===0?10:40), a=b*p/100;
    return {html:'<p class="eq">¿Qué porcentaje de '+fmt(b)+' es '+fmt(a)+'?</p><p class="eq">'+rl(3)+' %</p>',clave:fmt(a)+' ÷ '+fmt(b)+' × 100 = <b>'+p+' %</b>',chk:ex('a/b*100',{a,b},p,p+' %',{tol:1e-9}),uid:'%q'+a+'/'+b};}
  const N=u*R.int(1,d===0?50:500)*100;
  if(k==='inverso'){const F=N*(100+p)/100; return {html:'<p class="enun">Después de un aumento del '+p+' %, un precio quedó en '+money(F)+'. ¿Cuál era el precio original?</p><p class="eq">'+rl(5)+'</p>',clave:'El precio nuevo es el '+(100+p)+' % del original: '+money(F)+' ÷ '+fmt((100+p)/100)+' = <b>'+money(N)+'</b> <span class="nota">(no se resta el '+p+' % del precio nuevo)</span>',chk:ex('F*100/(100+p)',{F,p},N,money(N),{tol:1e-6}),uid:'%i'+F+p};}
  const sube=k==='aumento', r=N*(100+(sube?p:-p))/100, cambio=N*p/100;
  return {html:'<p class="enun">Un precio de '+money(N)+(sube?' sube':' baja')+' un '+p+' %. ¿Cuál es el nuevo precio?</p><p class="eq">'+rl(5)+'</p>',clave:p+' % de '+money(N)+' = '+money(cambio)+'; '+money(N)+(sube?' + ':' − ')+money(cambio)+' = <b>'+money(r)+'</b>',chk:ex(sube?'N*(100+p)/100':'N*(100-p)/100',{N,p},r,money(r),{tol:1e-6}),uid:'%'+k+N+p};};

function interesCompuesto(C,r,t){ // devuelve pasos año a año (enteros exactos)
  const pasos=[]; let M=C; for(let i=1;i<=t;i++){const nuevo=M*(100+r)/100; pasos.push('Año '+i+': '+money(M)+' × '+fmt((100+r)/100)+' = '+money(nuevo)); M=nuevo;} return {M,pasos};}
CALC.interes=c=>{const {R,d}=c;
  if(d===0||R.bool(0.45)){const C=R.int(1,d===2?200:50)*100000, r=R.pick([2,3,4,5,6,8,10,12]), t=R.int(1,5), I=C*r*t/100, M=C+I;
    return {html:'<p class="enun">Capital de '+money(C)+' al '+r+' % anual de <b>interés simple</b> durante '+t+' año'+(t>1?'s':'')+'. ¿Cuánto interés gana y cuál es el monto final?</p><p class="eq">Interés: '+rl(5)+' Monto: '+rl(5)+'</p>',
      clave:'I = C × r × t = '+money(C)+' × '+fmt(r/100)+' × '+t+' = <b>'+money(I)+'</b>; M = C + I = <b>'+money(M)+'</b>',chk:[ex('C*r*t/100',{C,r,t},I,money(I)),ex('C+C*r*t/100',{C,r,t},M,money(M))],uid:'is'+C+r+t};}
  const C=R.int(1,20)*1000000, r=R.pick(d===1?[10,20]:[5,10,20]), t=R.int(2,3); const ic=interesCompuesto(C,r,t);
  return {html:'<p class="enun">Capital de '+money(C)+' al '+r+' % anual de <b>interés compuesto</b> durante '+t+' años. ¿Cuál es el monto final?</p><p class="eq">Monto: '+rl(6)+'</p>',
    clave:'M = C × (1 + r)<sup>t</sup> = '+money(C)+' × '+fmt((100+r)/100)+'<sup>'+t+'</sup>. '+ic.pasos.join('; ')+' → <b>'+money(ic.M)+'</b>',chk:ex('C*Math.pow(1+r/100,t)',{C,r,t},ic.M,money(ic.M),{tol:0.5}),uid:'ic'+C+r+t};};

function argLog(b,k){ if(k>=0) return fmt(Math.pow(b,k)); if(b===10) return decS(1,-k); return frH(1,Math.pow(b,-k)); }
CALC.logaritmos=c=>{const {R,g,d}=c; const b=R.pick([2,3,5,10]); const maxK=b===2?7:b===3?5:b===5?4:6; const k=R.pick(['directo','directo','suma','exponencial','inverso']);
  if(k==='directo'){const e=R.int(d===2&&g>=10?-3:(d===0?1:0),d===0?Math.min(maxK,4):maxK), x=Math.pow(b,e);
    return {html:'<p class="eq">log<sub>'+b+'</sub> '+argLog(b,e)+' = '+rl(2)+'</p>',clave:'Porque '+b+'<sup>'+e+'</sup> = '+argLog(b,e)+' → <b>'+fmt(e)+'</b>',chk:ex('Math.log(x)/Math.log(b)',{x,b},e,fmt(e),{tol:1e-9}),uid:'ld'+b+e};}
  if(k==='suma'){const m=R.int(1,Math.max(1,maxK-2)), n=R.int(1,Math.max(1,maxK-m));
    return {html:'<p class="eq">log<sub>'+b+'</sub> '+fmt(Math.pow(b,m))+' + log<sub>'+b+'</sub> '+fmt(Math.pow(b,n))+' = '+rl(2)+'</p>',clave:m+' + '+n+' = <b>'+(m+n)+'</b> <span class="nota">(también: log<sub>'+b+'</sub> '+fmt(Math.pow(b,m+n))+' = '+(m+n)+')</span>',chk:ex('Math.log(x)/Math.log(b)+Math.log(y)/Math.log(b)',{x:Math.pow(b,m),y:Math.pow(b,n),b},m+n,fmt(m+n),{tol:1e-9}),uid:'ls'+b+m+n};}
  if(k==='exponencial'){const e=R.int(2,maxK), x=Math.pow(b,e);
    return {html:'<p class="eq">'+b+'<sup>x</sup> = '+fmt(x)+' → x = '+rl(2)+'</p>',clave:fmt(x)+' = '+b+'<sup>'+e+'</sup> → <b>x = '+e+'</b>',chk:ex('Math.log(y)/Math.log(b)',{y:x,b},e,'x = '+e,{tol:1e-9}),uid:'le'+b+e};}
  const e=R.int(1,maxK-1), x=Math.pow(b,e);
  return {html:'<p class="eq">log<sub>'+b+'</sub> x = '+e+' → x = '+rl(3)+'</p>',clave:'x = '+b+'<sup>'+e+'</sup> = <b>'+fmt(x)+'</b>',chk:ex('Math.pow(b,e)',{b,e},x,fmt(x)),uid:'li'+b+e};};

const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41]];
function razonChk(num,den){const s=simp(num,den); return {f:'razon',num,den,r:s,mostrar:frT(s[0],s[1])};}
CALC.trigonometria=c=>{const {R,d}=c;
  if(R.bool(0.35)){const T=[['sen',30,[1,2]],['cos',60,[1,2]],['tan',45,[1,1]],['sen',90,[1,1]],['cos',0,[1,1]],['sen',0,[0,1]],['cos',90,[0,1]],['tan',0,[0,1]]]; const e=R.pick(T);
    return {html:'<p class="eq">'+e[0]+' '+e[1]+'° = '+rl(3)+'</p>',clave:e[0]+' '+e[1]+'° = <b>'+frT(e[2][0],e[2][1])+'</b>',chk:{f:'trigesp',fn:e[0],ang:e[1],r:e[2],mostrar:frT(e[2][0],e[2][1])},uid:'te'+e[0]+e[1]};}

function minPiezas(m){ // programación dinámica: mínimo número de monedas/billetes
  const U=m/50, best=new Array(U+1).fill(Infinity), from=new Array(U+1).fill(0); best[0]=0;
  for(let i=1;i<=U;i++) for(const dn of DENOMS){const k=dn/50; if(k<=i&&best[i-k]+1<best[i]){best[i]=best[i-k]+1;from[i]=dn;}}
  const out=[]; let i=U; while(i>0){out.push(from[i]); i-=from[i]/50;} return out.sort((a,b)=>b-a);
}

function terminosSerie(gen,n){const t=[]; const k=gen.k;
  for(let i=0;i<n;i++){let v;
    if(k==='arit') v=gen.a0+i*gen.d;
    else if(k==='geom') v=gen.a0*Math.pow(gen.r,i);
    else if(k==='alt'||k==='dosreg'){ if(i===0) v=gen.a0; else { const prev=t[i-1]; v= i%2===1 ? prev+gen.p : (k==='alt'?prev-gen.q:prev*gen.m); } }
    else if(k==='cuad') v=(i+gen.s)*(i+gen.s);
    else if(k==='tri') v=(i+gen.s)*(i+gen.s+1)/2;
    else if(k==='fib') v=i===0?gen.a:i===1?gen.b:t[i-1]+t[i-2];
    else if(k==='cuadseq'){const n1=i+1; v=gen.a*n1*n1+gen.b*n1+gen.c;}
    t.push(v);} return t;}
function reglaSerie(gen){const k=gen.k;
  if(k==='arit') return gen.d>=0?'se suma '+fmt(gen.d)+' cada vez':'se resta '+fmt(-gen.d)+' cada vez';
  if(k==='geom') return 'se multiplica por '+fmt(gen.r)+' cada vez';
  if(k==='alt') return 'se suma '+gen.p+' y luego se resta '+gen.q+', alternando';
  if(k==='dosreg') return 'se suma '+gen.p+' y luego se multiplica por '+gen.m+', alternando';
  if(k==='cuad') return 'son números cuadrados: '+gen.s+'², '+(gen.s+1)+'², '+(gen.s+2)+'²…';
  if(k==='tri') return 'números triangulares: se suma 1 más cada vez (+'+(gen.s+1)+', +'+(gen.s+2)+', +'+(gen.s+3)+'…)';
  if(k==='fib') return 'cada término es la suma de los dos anteriores';
  if(k==='cuadseq') return 'las segundas diferencias son constantes (iguales a '+(2*gen.a)+')';
  return '';}
function genSerieNum(c,kind){const {R,g,d}=c; let gen;

  else if(kind==='desc'){const dd=R.pick(g<=1?[1,2]:[2,3,5,10]); gen={k:'arit',a0:dd*R.int(8,20)+R.int(0,dd-1),d:-dd};}
  else if(kind==='geom'||kind==='geomgen'){let r=R.pick(g<=4?[2,3]:[2,3,4,5]); if(kind==='geomgen'&&g>=10&&d===2&&R.bool(0.4)) r=-r; const a0=R.int(1,Math.abs(r)>=4?3:5); gen={k:'geom',a0,r};}
  else if(kind==='alt'){const p=R.int(3,9),q=R.int(1,p-1); gen={k:'alt',a0:R.int(1,20),p,q};}
  else if(kind==='dosreg'){gen={k:'dosreg',a0:R.int(1,4),p:R.int(1,3),m:2};}
  else if(kind==='cuad') gen={k:'cuad',s:R.int(1,d===2?6:3)};
  else if(kind==='tri') gen={k:'tri',s:R.int(1,d===2?5:2)};
  else if(kind==='fib') gen={k:'fib',a:R.int(1,5),b:R.int(1,7)};
  else gen={k:'cuadseq',a:R.int(1,3),b:R.int(-3,3),c:R.int(-5,5)};
  const general=kind==='aritgen'||kind==='geomgen'||(kind==='cuadseq'&&g>=10);
  const L=general?5:7, terms=terminosSerie(gen,L);
  let ocultos; const modo=general?'general':R.pick(g<=2?['sigue','huecos']:['sigue','huecos','regla']);
  if(modo==='huecos'){const i1=R.int(1,L-3); ocultos=[i1,R.int(i1+2,L-1)];} else if(modo==='general') ocultos=[L-1]; else ocultos=modo==='regla'?[L-1]:[L-2,L-1];
  const serieH='<div class="serie">'+terms.map((v,i)=>'<span class="par">'+(ocultos.includes(i)?'<span class="hueco"></span>':'<span class="t">'+fmt(v)+'</span>')+'<span class="sep">'+(i<terms.length-1?',':'…')+'</span></span>').join(' ')+'</div>';
  let pide, extra='', formula='', chk={f:'serie',gen,terms,ocultos,resp:ocultos.map(i=>terms[i]),mostrar:fmt(terms[ocultos[0]])};
  if(general){const n10=gen.k==='geom'?8:10; const tn=terminosSerie(gen,n10)[n10-1];
    if(gen.k==='arit') formula='a<sub>n</sub> = '+poly([gen.d,gen.a0-gen.d],'n');
    else if(gen.k==='geom') formula='a<sub>n</sub> = '+(gen.a0===1?'':fmt(gen.a0)+' · ')+par(gen.r)+'<sup>n − 1</sup>';
    else formula='a<sub>n</sub> = '+poly([gen.a,gen.b,gen.c],'n');
    pide='Completa el término que falta, escribe el término general a<sub>n</sub> y calcula a<sub>'+n10+'</sub>.'; extra='<p class="eq">a<sub>n</sub> = '+rl(7)+' a<sub>'+n10+'</sub> = '+rl(4)+'</p>';
    chk.n=n10; chk.tn=tn;

    const vis=new Set(); const st=[[-1,-1]]; vis.add(k(-1,-1));
    while(st.length){const p=st.pop(); for(const dd of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=p[0]+dd[0], ny=p[1]+dd[1]; if(nx<-1||ny<-1||nx>W||ny>H) continue; const kk=k(nx,ny); if(vis.has(kk)||set.has(kk)) continue; vis.add(kk); st.push([nx,ny]);}}

}

const COL=['Unidades','Decenas','Centenas','Unidades de mil','Decenas de mil'];
const digs=n=>String(n).split('').reverse().map(Number);
const ERR={};
ERR.conteo=c=>{const {R}=c; const a=R.int(1,5), b=R.int(1,Math.min(5,9-a)), modo=R.pick(['grupo','salto']);
  const dib='<div class="fila-dib">'+grupoFiguras(a,'circulo')+'<span class="signo">+</span>'+grupoFiguras(b,'circulo')+'</div>';
  let pasos, final;
  if(modo==='grupo'){const a2=a+1; final=a2+b; pasos=[{t:'Cuento el primer grupo: hay '+a2+'.',v:a2,e:a},{t:'Cuento el segundo grupo: hay '+b+'.',v:b,e:b},{t:'Junto: '+a2+' y '+b+' son '+final+'.',v:final,e:a2+b}];
    return {enun:'Así contó '+c.N+' todos los círculos:',dib,pasos,porque:'En el primer grupo hay '+a+', no '+a2+': contó uno de más.',correccion:'Primer grupo: '+a+'. Entonces '+a+' y '+b+' son '+(a+b)+'.',correcto:fmt(a+b),chkc:ex('a+b',{a,b},a+b,fmt(a+b)),final};}
  const tot=a+b, sal=R.int(2,tot); const seq=[]; for(let i=1;i<=tot+1;i++) if(i!==sal) seq.push(i); final=tot+1;
  pasos=[{t:'Cuento el primer grupo: hay '+a+'.',v:a,e:a},{t:'Cuento el segundo grupo: hay '+b+'.',v:b,e:b},{t:'Cuento todos juntos: '+seq.join(', ')+'. Hay '+final+'.',v:final,e:tot}];
  return {enun:'Así contó '+c.N+' todos los círculos:',dib,pasos,porque:'Al contar todos juntos se saltó el número '+sal+'.',correccion:'1, 2, … sin saltar ninguno: hay '+tot+'.',correcto:fmt(tot),chkc:ex('a+b',{a,b},tot,fmt(tot)),final};};
ERR.suma=c=>{const {R,g}=c; const nd=g<=1?2:g===2?3:R.int(3,4); let a,b,j,t=0;
  do{a=R.int(Math.pow(10,nd-1),Math.pow(10,nd)-1); b=R.int(Math.pow(10,nd-1),Math.pow(10,nd)-1); const da=digs(a), db=digs(b); const cand=[]; let cin=0; for(let i=0;i<nd;i++){if(i>0&&cin===1) cand.push(i); cin=da[i]+db[i]+cin>9?1:0;} j=cand.length?R.pick(cand):-1; t++;}while(j<0&&t<300);
  const da=digs(a), db=digs(b), pasos=[]; let cin=0, res=[];
  for(let i=0;i<nd;i++){const correcto=da[i]+db[i]+cin; const s=i===j?da[i]+db[i]:correcto; const ult=i===nd-1;
    const txt0=COL[i]+': '+da[i]+' + '+db[i]+(cin&&i!==j?' + 1 (que llevaba)':'')+' = '+s+'. '+(s>9&&!ult?'Escribo '+(s%10)+' y llevo 1.':'Escribo '+s+'.');
    pasos.push({t:txt0,v:s,e:correcto}); res.unshift(ult?String(s):String(s%10)); cin=s>9?1:0;}
  const final=Number(res.join('')); pasos.push({t:'Resultado: '+fmt(final)+'.',v:final,e:final});
  return {enun:c.N+' sumó '+fmt(a)+' + '+fmt(b)+' en columna:',pasos,porque:'En las '+COL[j].toLowerCase()+' olvidó sumar el 1 que llevaba.',correccion:COL[j]+': '+da[j]+' + '+db[j]+' + 1 = '+(da[j]+db[j]+1)+'.',correcto:fmt(a+b),chkc:ex('a+b',{a,b},a+b,fmt(a+b)),final};};
ERR.resta=c=>{const {R,g}=c; const nd=g<=1?2:g===2?3:R.int(3,4); let a,b,j,t=0;
  do{const ta=[],tb=[]; for(let i=0;i<nd;i++){ta.push(R.int(1,9)); tb.push(R.int(0,9));} tb[nd-1]=R.int(1,Math.max(1,ta[nd-1]-1)); a=Number(ta.slice().reverse().join('')); b=Number(tb.slice().reverse().join(''));
    j=-1; for(let i=0;i<nd-1;i++){ if(ta[i]<tb[i]){j=i;break;} } t++;}while((j<0||a<=b||digs(b)[j]-digs(a)[j]===5)&&t<500);
  const T=digs(a), B=digs(b); while(B.length<nd) B.push(0); const pasos=[], res=[];
  for(let i=0;i<nd;i++){ if(i===j){pasos.push({t:COL[i]+': '+B[i]+' − '+T[i]+' = '+(B[i]-T[i])+'. Escribo '+(B[i]-T[i])+'.',v:B[i]-T[i],e:T[i]+10-B[i]}); res.unshift(B[i]-T[i]); continue;}
    if(T[i]<B[i]){T[i+1]-=1; const v=T[i]+10-B[i]; pasos.push({t:COL[i]+': presto 1 a la siguiente columna: '+(T[i]+10)+' − '+B[i]+' = '+v+'.',v,e:v}); res.unshift(v);} else {const v=T[i]-B[i]; pasos.push({t:COL[i]+': '+T[i]+' − '+B[i]+' = '+v+'.',v,e:v}); res.unshift(v);} }
  const final=Number(res.join('')); pasos.push({t:'Resultado: '+fmt(final)+'.',v:final,e:final});
  const D=digs(a);
  return {enun:c.N+' restó '+fmt(a)+' − '+fmt(b)+' en columna:',pasos,porque:'En las '+COL[j].toLowerCase()+' restó el número pequeño del grande ('+B[j]+' − '+D[j]+') en lugar de pedir prestado.',correccion:COL[j]+': pido 1 prestado: '+(D[j]+10)+' − '+B[j]+' = '+(D[j]+10-B[j])+', y la columna siguiente queda con 1 menos.',correcto:fmt(a-b),chkc:ex('a-b',{a,b},a-b,fmt(a-b)),final};};
ERR.multdesc=c=>{const {R}=c; const T=R.int(1,9), U=R.int(1,9), m=R.int(3,9), a=T*10+U; const p1=U*m, p2=T*m;
  const pasos=[{t:'Descompongo: '+a+' = '+(T*10)+' + '+U+'.',v:a,e:a},{t:U+' × '+m+' = '+p1+'.',v:p1,e:p1},{t:(T*10)+' × '+m+' = '+p2+'.',v:p2,e:T*10*m},{t:'Sumo: '+p1+' + '+p2+' = '+(p1+p2)+'.',v:p1+p2,e:p1+p2}];
  return {enun:c.N+' multiplicó '+a+' × '+m+' descomponiendo:',pasos,porque:'Al multiplicar '+(T*10)+' × '+m+' olvidó el cero: multiplicó '+T+' × '+m+'.',correccion:(T*10)+' × '+m+' = '+(T*10*m)+'; '+p1+' + '+(T*10*m)+' = '+(a*m)+'.',correcto:fmt(a*m),chkc:ex('a*m',{a,m},a*m,fmt(a*m)),final:p1+p2};};
ERR.mult2=c=>{const {R}=c; const a=R.int(12,c.g>=5?999:99), t=R.int(1,9), u=R.int(1,9), b=10*t+u; const p1=a*u, p2=a*t, final=p1+p2;
  const pasos=[{t:fmt(a)+' × '+u+' = '+fmt(p1)+'.',v:p1,e:p1},{t:fmt(a)+' × '+t+' = '+fmt(p2)+'; lo escribo debajo, alineado con las unidades.',v:p2,e:p2*10},{t:'Sumo: '+fmt(p1)+' + '+fmt(p2)+' = '+fmt(final)+'.',v:final,e:final}];
  return {enun:c.N+' multiplicó '+fmt(a)+' × '+b+' en columna:',pasos,porque:'El '+t+' está en las decenas: '+fmt(a)+' × '+t+' decenas = '+fmt(p2*10)+'. Debía correrlo un lugar a la izquierda.',correccion:fmt(p1)+' + '+fmt(p2*10)+' = '+fmt(a*b)+'.',correcto:fmt(a*b),chkc:ex('a*b',{a,b},a*b,fmt(a*b)),final};};
ERR.division=c=>{const {R}=c; let D,v,q,steps,zi,t=0;
  do{v=R.int(2,9); const k=R.int(1,9), m=R.int(1,9); q=k*100+m; D=v*q; steps=[]; const dg=String(D).split('').map(Number); let cur=0, started=false;
    for(let i=0;i<dg.length;i++){cur=cur*10+dg[i]; if(!started&&cur<v&&i<dg.length-1) continue; started=true; const qd=Math.floor(cur/v); steps.push({cur,qd,rem:cur-qd*v}); cur=cur-qd*v;}
    zi=steps.findIndex((s,i)=>i>0&&s.qd===0); t++;}while(zi<0&&t<100);
  const pasos=steps.map((s,i)=>i===zi?{t:'Bajo la siguiente cifra: '+s.cur+' ÷ '+v+' no alcanza, así que sigo sin escribir nada en el cociente.',v:'nada',e:'0'}:{t:(i===0?'Tomo ':'Bajo la siguiente cifra: ')+s.cur+' ÷ '+v+' = '+s.qd+', sobra '+s.rem+'. Escribo '+s.qd+'.',v:String(s.qd),e:String(s.qd)});
  const final=Number(steps.filter((s,i)=>i!==zi).map(s=>s.qd).join('')); pasos.push({t:'Cociente: '+fmt(final)+'.',v:final,e:final});
  return {enun:c.N+' dividió '+fmt(D)+' ÷ '+v+':',pasos,porque:'Cuando la cifra no alcanza para dividir, hay que escribir 0 en el cociente; '+c.N+' no lo escribió.',correccion:'Escribo 0 en el cociente en ese paso; el cociente es '+fmt(q)+' (comprobación: '+v+' × '+fmt(q)+' = '+fmt(D)+').',correcto:fmt(q),chkc:ex('D/v',{D,v},q,fmt(q)),final};};
ERR.orden=c=>{const {R}=c; if(R.bool()){let a,b,cc; do{a=R.int(2,20); b=R.int(2,9); cc=R.int(2,9);}while(a+b===b*cc); const s=a+b, W=s*cc;
    return {enun:c.N+' calculó '+a+' + '+b+' × '+cc+':',pasos:[{t:a+' + '+b+' = '+s+'.',v:s,e:b*cc},{t:s+' × '+cc+' = '+W+'.',v:W,e:W}],porque:'La multiplicación se hace antes que la suma.',correccion:b+' × '+cc+' = '+(b*cc)+'; '+a+' + '+(b*cc)+' = '+(a+b*cc)+'.',correcto:fmt(a+b*cc),chkc:ex('a+b*c',{a,b,c:cc},a+b*cc,fmt(a+b*cc)),final:W};}
  let a,b,cc,dd; do{a=R.int(2,9); b=R.int(2,9); cc=R.int(2,9); dd=R.int(2,9);}while(a*b+cc===cc*dd); const p=a*b, s=p+cc, W=s*dd;
  return {enun:c.N+' calculó '+a+' × '+b+' + '+cc+' × '+dd+':',pasos:[{t:a+' × '+b+' = '+p+'.',v:p,e:p},{t:p+' + '+cc+' = '+s+'.',v:s,e:cc*dd},{t:s+' × '+dd+' = '+fmt(W)+'.',v:W,e:W}],porque:'Sumó antes de terminar las multiplicaciones: '+cc+' × '+dd+' se hace primero.',correccion:cc+' × '+dd+' = '+(cc*dd)+'; '+p+' + '+(cc*dd)+' = '+(p+cc*dd)+'.',correcto:fmt(p+cc*dd),chkc:ex('a*b+c*d',{a,b,c:cc,d:dd},p+cc*dd,fmt(p+cc*dd)),final:W};};
ERR.areaper=c=>{const {R,T}=c; let w,h; do{w=R.int(3,15);h=R.int(2,12);}while(w*h===2*(w+h)); const pideA=R.bool();
  const P=2*(w+h), A=w*h;
  if(pideA) return {enun:'¿Cuál es el área de '+T.espacio+', un rectángulo de '+w+' m por '+h+' m? Así lo resolvió '+c.N+':',pasos:[{t:'Datos: largo '+w+' m, ancho '+h+' m.',v:'d',e:'d'},{t:'Área = largo + ancho + largo + ancho.',v:'perimetro',e:'area'},{t:w+' + '+h+' + '+w+' + '+h+' = '+P+'.',v:P,e:P},{t:'El área es '+P+' m².',v:P,e:P}],porque:'Usó la fórmula del perímetro (el borde), no la del área (la superficie).',correccion:'Área = largo × ancho = '+w+' × '+h+' = '+A+' m².',correcto:A+' m²',chkc:ex('w*h',{w,h},A,A+' m²'),final:P};
  return {enun:'¿Cuántos metros de cerca necesita '+T.espacio+', un rectángulo de '+w+' m por '+h+' m? Así lo resolvió '+c.N+':',pasos:[{t:'Datos: largo '+w+' m, ancho '+h+' m.',v:'d',e:'d'},{t:'Perímetro = largo × ancho.',v:'area',e:'perimetro'},{t:w+' × '+h+' = '+A+'.',v:A,e:A},{t:'Se necesitan '+A+' m.',v:A,e:A}],porque:'Calculó el área (la superficie) en lugar del perímetro (el borde).',correccion:'Perímetro = '+w+' + '+h+' + '+w+' + '+h+' = '+P+' m.',correcto:P+' m',chkc:ex('2*(w+h)',{w,h},P,P+' m'),final:A};};
ERR.fracciones=c=>{const {R}=c; const misma=R.bool(0.35); let a,b,cc,dd; do{b=R.int(2,9); dd=misma?b:R.int(2,9); a=R.int(1,b-1); cc=R.int(1,dd-1);}while(!misma&&b===dd);
  const wn=a+cc, wd=misma?2*b:b+dd, ws=simp(wn,wd), L=lcm(b,dd), cn=a*L/b+cc*L/dd, cs=simp(cn,L);

ERR.decimales=c=>{const {R}=c; let A,B; do{A=R.int(101,999); B=R.int(11,299);}while(A%10===0||B%10===0||B<100&&B<20);

function nombreSub(tipo,s){ if(tipo==='calculo'){const o=OPS.find(x=>x[0]===s); return o?o[1]:s;} return (TIPOS[tipo].nombres||{})[s]||s; }
function normalizar(q){
  const p={}; const get=k=>q[k]==null||q[k]===''?null:String(q[k]);
  p.tipo=TIPOS[get('tipo')]?get('tipo'):'calculo';
  let g=parseInt(get('grado'),10); p.grado=isNaN(g)?3:Math.max(0,Math.min(11,g));
  p.dificultad=['facil','media','reto'].includes(get('dificultad'))?get('dificultad'):'media';
  let n=parseInt(get('n'),10); p.n=isNaN(n)?N_DEF[p.tipo][p.grado]:Math.max(4,Math.min(20,n));
  let s=parseInt(get('semilla'),10); p.semilla=(isNaN(s)||s<1)?1+Math.floor(Math.random()*999999):Math.min(s,2147483646);
  p.tema=TEMAS.some(t=>t.id===get('tema'))?get('tema'):'';
  const subs=TIPOS[p.tipo].subs(p.grado), pv=get(TIPOS[p.tipo].param);
  p.sub=pv&&pv!=='auto'&&subs.includes(pv)?pv:'auto';
  const mn=parseInt(get('rmin'),10), mx=parseInt(get('rmax'),10);
  p.rmin=null; p.rmax=null; if(!isNaN(mn)&&!isNaN(mx)&&mn>=0&&mx>mn&&mx<=9999999){p.rmin=mn;p.rmax=mx;}

function generar(params){
  const p=normalizar(params||{}); const TP=TIPOS[p.tipo];
  const R=Rng(hashStr([p.semilla,p.tipo,p.grado,p.dificultad,p.sub,p.tema,p.rmin,p.rmax,p.llevada].join('|')));
  const T=p.tema?TEMAS.find(t=>t.id===p.tema):R.pick(TEMAS); const nombres=R.sample(NOMBRES,3);
  const c={R,g:p.grado,d:{facil:0,media:1,reto:2}[p.dificultad],p,T,N:nombres[0],M:nombres[1],O:nombres[2]};
  c.lista=listaPrecios(c);
  const base=p.sub!=='auto'?[p.sub]:(TP.porDefecto?TP.porDefecto(p.grado):TP.subs(p.grado));
  let plan=[]; while(plan.length<p.n) plan=plan.concat(R.shuffle(base)); plan=plan.slice(0,p.n);
  if(p.tipo==='calculo'||p.tipo==='series') plan=plan.sort((a,b)=>base.indexOf(a)-base.indexOf(b));
  const items=[], usados=new Set();
  plan.forEach(sub=>{let it,t=0; do{it=TP.gen(c,sub); t++;}while(usados.has(it.uid)&&t<40); usados.add(it.uid); it.sub=sub; items.push(it);});
  const intro=T.intro.replace(/\{N\}/g,c.N).replace(/\{M\}/g,c.M)+' '+TP.puente(c);
  return {p,titulo:T.titulo,tema:T.id,intro,instr:TP.instr(c),items,lista:p.tipo==='dinero'||(p.tipo==='problemas'&&p.grado>=3)?c.lista:null,tipoNombre:TP.nombre,cols:!!TP.cols&&p.grado>=1&&!['trigonometria','interes','sistemas'].includes(p.sub)};
}

function revisable(c){ if(!c||Array.isArray(c)||c.mostrar==null) return false;
  if(['patron','error','sis','cuad'].includes(c.f)) return false;
  if(c.f==='serie'&&c.ocultos&&c.ocultos.length!==1) return false;
  if(c.f==='poli'&&c.pide==='ambos') return false; return true; }
function normResp(t){ return String(t).replace(/[−–]/g,'-').replace(/^\s*[a-z]\s*=\s*/i,'').trim(); }
function numsDe(t){ const s=normResp(t).replace(/\$|cop|pesos/gi,'').replace(/(\d)\.(?=\d{3}(\D|$))/g,'$1').replace(/(\d),(\d)/g,'$1.$2');
  return (s.match(/-?\d+(\.\d+)?(\s*\/\s*\d+)?/g)||[]).map(x=>{const f=x.split('/'); return f.length===2?(+f[0])/(+f[1]):parseFloat(x);}); }
const planoR=t=>normResp(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ/.,-]+/g,' ').trim();
function respCorrecta(dada,esperada){ if(!String(dada).trim()) return false;
  const a=numsDe(dada), b=numsDe(esperada);
  if(b.length===1&&a.length===1) return Math.abs(a[0]-b[0])<(Number.isInteger(b[0])?1e-9:1e-6*Math.max(1,Math.abs(b[0])));
  return planoR(dada)===planoR(esperada); }
function activarPractica(f){ const intentos={};

    if(respCorrecta(inp.value,it.chk.mostrar)){ fb.className='fb bien'; fb.textContent='Correcto. ¿Podrías explicar cómo lo pensaste?'; return true; }
    if(inp.dataset.ult===inp.value.trim()){ fb.className='fb mal'; fb.textContent='Es la misma respuesta de antes. Cambia algo de tu procedimiento antes de revisar otra vez.'; return false; }
    inp.dataset.ult=inp.value.trim();
    intentos[i]=(intentos[i]||0)+1; fb.className='fb mal';
    if(intentos[i]<2) fb.textContent='Todavía no. Revisa tu procedimiento y vuelve a intentarlo.';
    else { fb.innerHTML='Mira la clave, busca dónde cambió tu camino: '+it.clave; }

  const b=document.getElementById('b-revisar'); if(b) b.addEventListener('click',()=>{ let bien=0,total=0;

  $('l-sub').firstChild.nodeValue=p.tipo==='calculo'?'Operación':'Enfoque'; $('g-calc').hidden=p.tipo!=='calculo';}
function pintarControles(p){$('c-tipo').value=p.tipo; $('c-grado').value=p.grado; $('c-dif').value=p.dificultad; $('c-n').value=p.n; $('c-tema').value=p.tema; llenarSub(p);
  $('c-rmin').value=p.rmin==null?'':p.rmin; $('c-rmax').value=p.rmax==null?'':p.rmax; $('c-llevada').value=p.llevada; $('semilla-info').textContent='Ficha n.º '+p.semilla;}
function render(params,noURL){const f=generar(params); actual=f; $('ficha').innerHTML=htmlFicha(f); activarPractica(f); $('clave').innerHTML=htmlClave(f);
  document.title=f.titulo+' · Fichas SABI'; if(!noURL){try{history.replaceState(null,'',aURL(f.p));}catch(e){}} pintarControles(f.p); return f;}
function leerControles(){return {tipo:$('c-tipo').value,grado:$('c-grado').value,dificultad:$('c-dif').value,n:$('c-n').value,tema:$('c-tema').value,[TIPOS[$('c-tipo').value].param]:$('c-sub').value,rmin:$('c-rmin').value,rmax:$('c-rmax').value,llevada:$('c-llevada').value,semilla:actual?actual.p.semilla:''};}
function aviso(t){const a=$('aviso'); a.textContent=t; a.classList.add('ver'); clearTimeout(aviso._t); aviso._t=setTimeout(()=>a.classList.remove('ver'),2200);}
function iniciar(){
  $('c-tipo').innerHTML=Object.keys(TIPOS).map(k=>'<option value="'+k+'">'+TIPOS[k].nombre+'</option>').join('');
  $('c-grado').innerHTML=GRADOS.map((g,i)=>'<option value="'+i+'">'+g+'</option>').join('');
  $('c-tema').innerHTML='<option value="">Sorpresa (al azar)</option>'+TEMAS.map(t=>'<option value="'+t.id+'">'+t.titulo+'</option>').join('');
  render(leerURL());
  const cambio=ev=>{const q=leerControles(); if(ev&&(ev.target.id==='c-tipo'||ev.target.id==='c-grado')){q.n='';q[TIPOS[q.tipo].param]='auto';} render(q);};
  ['c-tipo','c-grado','c-dif','c-tema','c-sub','c-llevada'].forEach(id=>$(id).addEventListener('change',cambio));
  ['c-n','c-rmin','c-rmax'].forEach(id=>$(id).addEventListener('change',cambio));
  $('b-nueva').addEventListener('click',()=>{const q=leerControles(); q.semilla=1+Math.floor(Math.random()*999999); render(q); window.scrollTo({top:$('ficha').offsetTop-10,behavior:'smooth'});});
  $('b-clave').addEventListener('click',()=>{const c=$('clave'); c.hidden=!c.hidden; $('b-clave').textContent=c.hidden?'Mostrar clave':'Ocultar clave'; $('b-clave').setAttribute('aria-pressed',String(!c.hidden)); if(!c.hidden) c.scrollIntoView({behavior:'smooth'});});
  $('c-imp-clave').addEventListener('change',e=>document.body.classList.toggle('imprimir-clave',e.target.checked));
  $('b-imprimir').addEventListener('click',()=>window.print());
  $('b-copiar').addEventListener('click',()=>{const url=location.href; const ok=()=>aviso('Enlace copiado: esta misma ficha se abrirá igual.');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok,()=>window.prompt('Copia este enlace:',url)); else window.prompt('Copia este enlace:',url);});
}
window.__fichas={generar,render,normalizar,revisable,respCorrecta,numsDe,temas:TEMAS.map(t=>t.id),tipos:Object.keys(TIPOS),subs:(t,g)=>TIPOS[t].subs(g),fmt,money};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',iniciar); else iniciar();
})();
</script>
